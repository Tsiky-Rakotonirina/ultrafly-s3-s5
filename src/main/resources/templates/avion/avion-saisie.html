<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Modifier Avion - UltraFly' : 'Nouvel Avion - UltraFly'}">Saisie Avion - UltraFly</title>
    <link rel="icon" type="image/png" th:href="@{/image/logo.png}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/template.css}">
</head>
<body>
    <div class="bg-element bg-element-1"></div>
    <div class="bg-element bg-element-2"></div>
    
    <div class="uf-layout">
        <!-- Sidebar -->
        <aside class="uf-sidebar">
            <div class="uf-sidebar-header">
                <div class="uf-sidebar-logo">
                    <span class="logo-ultra">Ultra</span><span class="logo-fly">Fly</span>
                </div>
                <button class="uf-sidebar-toggle"><span>←</span></button>
            </div>
            <nav class="uf-sidebar-nav">
                <ul class="uf-sidebar-menu">
                    <li class="uf-sidebar-item"><a th:href="@{/avion}" class="uf-sidebar-link active"><span class="uf-sidebar-icon">✈️</span><span class="uf-sidebar-text">Avion</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/vol}" class="uf-sidebar-link"><span class="uf-sidebar-icon">🛫</span><span class="uf-sidebar-text">Vol</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/reservation}" class="uf-sidebar-link"><span class="uf-sidebar-icon">🎫</span><span class="uf-sidebar-text">Réservation</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/personne}" class="uf-sidebar-link"><span class="uf-sidebar-icon">👥</span><span class="uf-sidebar-text">Personne</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/enregistrement}" class="uf-sidebar-link"><span class="uf-sidebar-icon">👨‍✈️</span><span class="uf-sidebar-text">Enregistrement</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/dashboard}" class="uf-sidebar-link"><span class="uf-sidebar-icon">📊</span><span class="uf-sidebar-text">Dashboard</span></a></li>
                </ul>
            </nav>
        </aside>
        
        <main class="uf-main">
            
            <div class="uf-breadcrumb">
                <a th:href="@{/avion}">← Retour à la liste</a>
            </div>
            
            <div class="uf-component-form">
                <h1 class="uf-subtitle" th:text="${isEdit ? '✏️ Modifier Avion ' + avion.numero : '✈️ Nouvel Avion'}">Saisie Avion</h1>
                
                <form th:action="@{/avion/saisie}" method="post" th:object="${avion}" class="uf-form">
                    
                    <!-- ID caché pour modification -->
                    <input type="hidden" th:field="*{idAvion}">
                    
                    <!-- Informations Générales -->
                    <div class="uf-form-section-title">📋 Informations Générales</div>
                    
                    <div class="uf-form-group">
                        <label class="uf-form-label">Constructeur *</label>
                        <input type="text" th:field="*{constructeur}" placeholder="Ex: Boeing, Airbus" class="uf-form-input" required>
                    </div>
                    
                    <div class="uf-form-group">
                        <label class="uf-form-label">Modèle *</label>
                        <input type="text" th:field="*{modele}" placeholder="Ex: 737-800, A320neo" class="uf-form-input" required>
                    </div>
                    
                    <div class="uf-form-group">
                        <label class="uf-form-label">Date de Possession</label>
                        <input type="date" th:field="*{datePossession}" class="uf-form-input">
                    </div>
                    
                    <div class="uf-form-group">
                        <label class="uf-form-label">Type de Carburant</label>
                        <select th:field="*{carburant.idCarburant}" class="uf-form-select">
                            <option value="">-- Sélectionner --</option>
                            <option th:each="carburant : ${carburants}" 
                                    th:value="${carburant.idCarburant}"
                                    th:text="${carburant.libelle}">
                            </option>
                        </select>
                    </div>
                    
                    <div class="uf-separator" style="flex: 1 1 100%;"></div>
                    
                    <!-- Caractéristiques Techniques -->
                    <div class="uf-form-section-title">⚙️ Caractéristiques Techniques</div>
                    
                    <div class="uf-form-group">
                        <label class="uf-form-label">Capacité (places)</label>
                        <input type="number" th:field="*{capacite}" placeholder="Ex: 180" class="uf-form-input" min="1">
                    </div>
                    
                    <div class="uf-form-group">
                        <label class="uf-form-label">Vitesse (km/h)</label>
                        <input type="number" step="0.01" th:field="*{vitesse}" placeholder="Ex: 850" class="uf-form-input">
                    </div>
                    
                    <div class="uf-form-group">
                        <label class="uf-form-label">Consommation (L/h)</label>
                        <input type="number" step="0.01" th:field="*{consommation}" placeholder="Ex: 2500" class="uf-form-input">
                    </div>
                    
                    <!-- Configuration Sièges (uniquement pour nouveau) -->
                    <div th:if="${!isEdit}" style="flex: 1 1 100%;">
                        <div class="uf-separator"></div>
                        <div class="uf-form-section-title">💺 Configuration Initiale des Sièges (optionnel)</div>
                        
                        <div class="uf-form-group">
                            <label class="uf-form-label">Nombre de Rangées</label>
                            <input type="number" name="rangees" placeholder="Ex: 30" class="uf-form-input" min="1">
                        </div>
                        
                        <div class="uf-form-group">
                            <label class="uf-form-label">Nombre de Colonnes (A-J max)</label>
                            <input type="number" name="colonnes" placeholder="Ex: 6" class="uf-form-input" min="1" max="10">
                        </div>
                        
                        <div class="uf-form-group">
                            <label class="uf-form-label">Catégorie des Sièges</label>
                            <select name="siegeCategorieId" class="uf-form-select">
                                <option value="">-- Ne pas créer de sièges --</option>
                                <option th:each="cat : ${siegeCategories}" 
                                        th:value="${cat.idSiegeCategorie}"
                                        th:text="${cat.libelle}">
                                </option>
                            </select>
                        </div>
                        
                        <div class="uf-form-group">
                            <label class="uf-form-label">Statut Initial</label>
                            <select name="avionStatutId" class="uf-form-select">
                                <option value="">-- Pas de statut --</option>
                                <option th:each="statut : ${statuts}" 
                                        th:value="${statut.idAvionStatut}"
                                        th:text="${statut.libelle}"
                                        th:if="${statuts != null}">
                                </option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="uf-separator" style="flex: 1 1 100%;"></div>
                    
                    <!-- Boutons -->
                    <div class="uf-form-group uf-form-group-full">
                        <button type="submit" class="uf-form-submit" th:text="${isEdit ? '💾 Enregistrer les modifications' : '✈️ Créer l\'avion'}">Soumettre</button>
                        <a th:href="@{/avion}" class="uf-form-submit" style="background: var(--text-muted); margin-left: 10px;">❌ Annuler</a>
                    </div>
                    
                </form>   
            </div>
            
        </main>
    </div>

    <script th:src="@{/js/template.js}"></script>
</body>
</html>
