<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer Statut Avion - UltraFly</title>
    <link rel="icon" type="image/png" th:href="@{/image/logo.png}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/template.css}">
</head>
<body>
    <div class="bg-element bg-element-1"></div>
    <div class="bg-element bg-element-2"></div>
    
    <div class="uf-layout">
        <aside class="uf-sidebar">
            <div class="uf-sidebar-header">
                <div class="uf-sidebar-logo"><span class="logo-ultra">Ultra</span><span class="logo-fly">Fly</span></div>
                <button class="uf-sidebar-toggle"><span>←</span></button>
            </div>
            <nav class="uf-sidebar-nav">
                <ul class="uf-sidebar-menu">
                    <li class="uf-sidebar-item"><a th:href="@{/avion}" class="uf-sidebar-link active"><span class="uf-sidebar-icon">✈️</span><span class="uf-sidebar-text">Avion</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/vol}" class="uf-sidebar-link"><span class="uf-sidebar-icon">🛫</span><span class="uf-sidebar-text">Vol</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/reservation}" class="uf-sidebar-link"><span class="uf-sidebar-icon">🎫</span><span class="uf-sidebar-text">Réservation</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/personne}" class="uf-sidebar-link"><span class="uf-sidebar-icon">👥</span><span class="uf-sidebar-text">Personne</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/enregistrement}" class="uf-sidebar-link"><span class="uf-sidebar-icon">👨‍✈️</span><span class="uf-sidebar-text">Enregistrement</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/dashboard}" class="uf-sidebar-link"><span class="uf-sidebar-icon">📊</span><span class="uf-sidebar-text">Dashboard</span></a></li>
                </ul>
            </nav>
        </aside>
        
        <main class="uf-main">
            
            <div class="uf-breadcrumb">
                <a th:href="@{/avion/{id}(id=${avion.idAvion})}">← Retour à la fiche</a>
            </div>
            
            <div class="uf-component-form">
                <h1 class="uf-subtitle">🔄 Changer Statut - <span th:text="${avion.numero}">AVN001</span></h1>
                
                <!-- Info Statut Actuel -->
                <div class="uf-info-box" th:if="${statutActuel != null}">
                    <p><strong>Statut actuel:</strong> <span th:text="${statutActuel.avionStatut.libelle}">En service</span></p>
                    <p><strong>Depuis:</strong> <span th:text="${#temporals.format(statutActuel.dateStatut, 'dd/MM/yyyy')}">01/01/2024</span></p>
                </div>
                <div class="uf-info-box" th:if="${statutActuel == null}">
                    <p>Aucun statut défini actuellement</p>
                </div>
                
                <form th:action="@{/avion/{id}/statut(id=${avion.idAvion})}" method="post" class="uf-form">
                    
                    <div class="uf-form-group uf-form-group-full">
                        <label class="uf-form-label">Nouveau Statut *</label>
                        <div class="uf-form-radio-group-vertical">
                            <label th:each="statut : ${statuts}" class="uf-form-radio-card">
                                <input type="radio" name="statutId" th:value="${statut.idAvionStatut}" required>
                                <span class="uf-form-radio-card-content">
                                    <span class="uf-form-radio-card-title" th:text="${statut.libelle}">En service</span>
                                    <span class="uf-form-radio-card-desc" th:text="${statut.description}">Description</span>
                                </span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="uf-separator" style="flex: 1 1 100%;"></div>
                    
                    <div class="uf-form-group uf-form-group-full">
                        <button type="submit" class="uf-form-submit">✅ Valider le changement</button>
                        <a th:href="@{/avion/{id}(id=${avion.idAvion})}" class="uf-form-submit" style="background: var(--text-muted); margin-left: 10px;">❌ Annuler</a>
                    </div>
                    
                </form>   
            </div>
            
        </main>
    </div>

    <script th:src="@{/js/template.js}"></script>
</body>
</html>
