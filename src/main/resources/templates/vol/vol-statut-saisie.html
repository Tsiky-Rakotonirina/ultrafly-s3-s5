<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Changer Statut - ' + ${vol.numero} + ' - UltraFly'">Changer Statut Vol - UltraFly</title>
    <link rel="icon" type="image/png" th:href="@{/image/logo.png}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/template.css}">
</head>
<body>
    <div class="bg-element bg-element-1"></div>
    <div class="bg-element bg-element-2"></div>
    
    <div class="uf-layout">
        <aside class="uf-sidebar">
            <div class="uf-sidebar-header">
                <div class="uf-sidebar-logo"><span class="logo-ultra">Ultra</span><span class="logo-fly">Fly</span></div>
                <button class="uf-sidebar-toggle"><span>←</span></button>
            </div>
            <nav class="uf-sidebar-nav">
                <ul class="uf-sidebar-menu">
                    <li class="uf-sidebar-item"><a th:href="@{/avion}" class="uf-sidebar-link"><span class="uf-sidebar-icon">✈️</span><span class="uf-sidebar-text">Avion</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/vol}" class="uf-sidebar-link active"><span class="uf-sidebar-icon">🛫</span><span class="uf-sidebar-text">Vol</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/reservation}" class="uf-sidebar-link"><span class="uf-sidebar-icon">🎫</span><span class="uf-sidebar-text">Réservation</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/personne}" class="uf-sidebar-link"><span class="uf-sidebar-icon">👥</span><span class="uf-sidebar-text">Personne</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/enregistrement}" class="uf-sidebar-link"><span class="uf-sidebar-icon">👨‍✈️</span><span class="uf-sidebar-text">Enregistrement</span></a></li>
                    <li class="uf-sidebar-item"><a th:href="@{/dashboard}" class="uf-sidebar-link"><span class="uf-sidebar-icon">📊</span><span class="uf-sidebar-text">Dashboard</span></a></li>
                </ul>
            </nav>
        </aside>
        
        <main class="uf-main">
            
            <div class="uf-breadcrumb">
                <a th:href="@{/vol/{id}(id=${vol.idVol})}">← Retour à la fiche</a>
            </div>
            
            <!-- Statut Actuel -->
            <div class="uf-component-fiche" style="margin-bottom: 30px;">
                <h1 class="uf-subtitle">📊 Statut Actuel du Vol <span th:text="${vol.numero}">VOL001</span></h1>
                
                <div class="uf-fiche">
                    <div class="uf-fiche-section">
                        <div class="uf-fiche-mini"
                             th:classappend="${vol.statutVol.libelle == 'Programme' ? 'status-info' : (vol.statutVol.libelle == 'Annule' ? 'status-danger' : (vol.statutVol.libelle == 'Atterri' ? 'status-success' : 'status-warning'))}">
                            <div class="uf-fiche-mini-title">Statut Actuel</div>
                            <p class="uf-statut-big" th:text="${vol.statutVol.libelle}">Programmé</p>
                            <p th:text="${vol.statutVol.description}">Vol planifié</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Formulaire Changement Statut -->
            <div class="uf-component-form">
                <h1 class="uf-subtitle">🔄 Changer Statut</h1>
                
                <form th:action="@{/vol/{id}/statut(id=${vol.idVol})}" method="post" class="uf-form">
                    
                    <div class="uf-form-group">
                        <label class="uf-form-label">Nouveau Statut *</label>
                        <select name="statutId" class="uf-form-select" required>
                            <option value="">-- Sélectionner --</option>
                            <option th:each="statut : ${statuts}" 
                                    th:value="${statut.idVolStatut}"
                                    th:text="${statut.libelle + ' - ' + statut.description}"
                                    th:disabled="${statut.idVolStatut == vol.statutVol.idVolStatut}">
                            </option>
                        </select>
                    </div>
                    
                    <div class="uf-separator" style="flex: 1 1 100%;"></div>
                    
                    <div class="uf-form-group uf-form-group-full">
                        <button type="submit" class="uf-form-submit">💾 Changer Statut</button>
                        <a th:href="@{/vol/{id}(id=${vol.idVol})}" class="uf-form-submit" style="background: var(--text-muted); margin-left: 10px;">❌ Annuler</a>
                    </div>
                    
                </form>
            </div>
            
        </main>
    </div>

    <script th:src="@{/js/template.js}"></script>
</body>
</html>
