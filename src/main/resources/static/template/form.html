    <div class="uf-component-form">
    
        <h1 class="uf-subtitle">Formulaire ----</h1>
        
        <form th:action="@{/submit}" method="post" class="uf-form">
            
            <!-- Input Hidden -->
            <input type="hidden" name="hiddenField" value="------" class="uf-form-hidden">
            
            <!-- Input Text -->
            <div class="uf-form-group">
                <label class="uf-form-label">Champ Texte</label>
                <input type="text" name="textField" placeholder="------" class="uf-form-input">
            </div>
            
            <!-- Input Date -->
            <div class="uf-form-group">
                <label class="uf-form-label">Date</label>
                <input type="date" name="dateField" class="uf-form-input">
            </div>
            
            <!-- Input Datetime -->
            <div class="uf-form-group">
                <label class="uf-form-label">Date et Heure</label>
                <input type="datetime-local" name="datetimeField" class="uf-form-input">
            </div>
            
            <!-- Dropdown / Select -->
            <div class="uf-form-group">
                <label class="uf-form-label">Sélection</label>
                <select name="selectField" class="uf-form-select">
                    <option value="">-- Choisir --</option>
                    <option value="option1">------</option>
                    <option value="option2">------</option>
                    <option value="option3">------</option>
                    <option value="option4">------</option>
                </select>
            </div>
            
            <!-- Radio Buttons -->
            <div class="uf-form-group">
                <label class="uf-form-label">Options Radio</label>
                <div class="uf-form-radio-group">
                    <label class="uf-form-radio">
                        <input type="radio" name="radioField" value="radio1">
                        <span class="uf-form-radio-custom"></span>
                        <span class="uf-form-radio-label">------</span>
                    </label>
                    <label class="uf-form-radio">
                        <input type="radio" name="radioField" value="radio2">
                        <span class="uf-form-radio-custom"></span>
                        <span class="uf-form-radio-label">------</span>
                    </label>
                </div>
            </div>
            
            <!-- Checkbox Style Divs (Cliquables) -->
            <div class="uf-form-group">
                <label class="uf-form-label">Sélection Multiple (Cliquer pour sélectionner)</label>
                <div class="uf-form-checkbox-group">
                    <div class="uf-form-checkbox-item" data-value="check1">
                        <span class="uf-form-checkbox-icon"></span>
                        <span class="uf-form-checkbox-text">------</span>
                        <input type="hidden" name="checkbox1" value="false">
                    </div>
                    <div class="uf-form-checkbox-item" data-value="check2">
                        <span class="uf-form-checkbox-icon"></span>
                        <span class="uf-form-checkbox-text">------</span>
                        <input type="hidden" name="checkbox2" value="false">
                    </div>
                </div>
            </div>

             <!-- Table Dynamique avec lignes ajoutables/supprimables -->
            <div class="uf-form-group uf-form-group-full">
                <label class="uf-form-label">Liste Dynamique</label>
                <table class="uf-form-table" id="dynamicTable">
                    <tbody>
                        <tr class="uf-form-table-row">
                            <td><input type="text" name="dynamicField[]" placeholder="------" class="uf-form-input"></td>
                            <td class="uf-form-table-action">
                                <button type="button" class="uf-form-btn-delete" onclick="removeRow(this)">✕</button>
                            </td>
                        </tr>
                        <tr class="uf-form-table-add-row">
                            <td colspan="2">
                                <button type="button" class="uf-form-btn-add" onclick="addRow()">+ Ajouter une ligne</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="uf-separator"></div>
            
            <!-- Submit Button -->
            <div class="uf-form-group">
                <button type="submit" class="uf-form-submit">Soumettre</button>
            </div>
            
        </form>   

    </div>
